<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&display=swap" rel="stylesheet">

<style>
    body,
    h1, h2, h3, h4, h5, h6,
    p, li, blockquote,
    a, button, input, textarea {
      font-family: "Commissioner", sans-serif;
      font-optical-sizing: auto;
      font-style: normal;
      font-variation-settings:
        "slnt" 0,
        "FLAR" 0,
        "VOLM" 0;
    }

    :root {
        --background-color: #faf4ed;
        --text-color: #282828;
        --link-color: #b4637a;
        --visited-color: #8f3f71;
        --code-background-color: #1d2021;
        --code-color: #fbf1c7;
        --blockquote-color: #504945;
    }

    ::selection {
        background-color:#9893a5;
        color: #fffaf3;
    }

    .card {
         border-radius: 12px;
         box-shadow: 0 6px 4px -4px rgb(00, 00, 00, 0.3),
                     0 8px 8px -3px rgb(00, 00, 00, 0.2);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --link-color: #d79921;
            --background-color: #1d2021;
            --heading-color: #fbf1c7;
            --text-color: #ebdbb2;
            --visited-color: #8f3f71;
            --code-background-color: #32302f;
            --code-color: #fbf1c7;
            --blockquote-color: #bdae93;
        }
        ::selection {
            background-color: #076678;
            
        }
    }

    code {
        padding: 1px;
        margin: 0px;
    }

    blockquote {
        border-left: 1px solid var(--blockquote-color);
        color: var(--blockquote-color);
    }
</style>
